name: Test Setup Provisioned Concurrency Action

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Run the action
      id: run-action
      uses: ./
      with:
        function-name: 'test-lambda-function'
        provisioned-concurrency: 1

    - name: Verify outputs
      run: |
        echo "New version: ${{ steps.run-action.outputs.new-version }}"
        echo "Provisioned concurrency: ${{ steps.run-action.outputs.provisioned-concurrency }}"
        if [[ -z "${{ steps.run-action.outputs.new-version }}" ]]; then
          echo "::error::Output 'new-version' is empty"
          exit 1
        fi
        if [[ -z "${{ steps.run-action.outputs.provisioned-concurrency }}" ]]; then
          echo "::error::Output 'provisioned-concurrency' is empty"
          exit 1
        fi

    - name: Cleanup
      if: always()
      run: |
        # Retrieve the current version of the Lambda function
        NEW_VERSION=$(aws lambda list-versions-by-function \
          --function-name test-lambda-function \
          --query 'Versions[-1].[Version]' \
          --output text)

        echo "Current version is ${NEW_VERSION}"

        # Remove provisioned concurrency
        aws lambda delete-provisioned-concurrency-config \
          --function-name test-lambda-function \
          --qualifier "${NEW_VERSION}" || true

        # Delete the version
        aws lambda delete-function \
          --function-name test-lambda-function \
          --qualifier "${NEW_VERSION}" || true
