name: Test Setup Provisioned Concurrency Action

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-basic:
    name: Basic flow (publish, set concurrency, poll, cleanup)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install mock AWS CLI
      run: |
        chmod +x test/mock-aws.sh
        mkdir -p "${{ runner.temp }}/mock-bin"
        ln -s "${{ github.workspace }}/test/mock-aws.sh" "${{ runner.temp }}/mock-bin/aws"
        echo "${{ runner.temp }}/mock-bin" >> "$GITHUB_PATH"

    - name: Run the action
      id: run-action
      uses: ./
      with:
        function-name: 'test-lambda-function'
        provisioned-concurrency: 3
        wait-for-ready: 'true'
        wait-timeout: '30'
        cleanup: 'true'
        versions-to-keep: '1'
      env:
        MOCK_AWS_VERSION: '42'
        MOCK_AWS_OLD_VERSIONS: "40\t39\t38"
        MOCK_AWS_ALIAS_VERSIONS: '39'
        MOCK_AWS_READY_AFTER: '2'

    - name: Verify outputs
      run: |
        echo "new-version=${{ steps.run-action.outputs.new-version }}"
        echo "provisioned-concurrency=${{ steps.run-action.outputs.provisioned-concurrency }}"

        if [[ "${{ steps.run-action.outputs.new-version }}" != "42" ]]; then
          echo "::error::Expected new-version=42, got '${{ steps.run-action.outputs.new-version }}'"
          exit 1
        fi
        if [[ "${{ steps.run-action.outputs.provisioned-concurrency }}" != "3" ]]; then
          echo "::error::Expected provisioned-concurrency=3, got '${{ steps.run-action.outputs.provisioned-concurrency }}'"
          exit 1
        fi

  test-no-cleanup:
    name: Cleanup disabled
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install mock AWS CLI
      run: |
        chmod +x test/mock-aws.sh
        mkdir -p "${{ runner.temp }}/mock-bin"
        ln -s "${{ github.workspace }}/test/mock-aws.sh" "${{ runner.temp }}/mock-bin/aws"
        echo "${{ runner.temp }}/mock-bin" >> "$GITHUB_PATH"

    - name: Run the action (no cleanup)
      id: run-action
      uses: ./
      with:
        function-name: 'test-lambda-function'
        provisioned-concurrency: 1
        wait-for-ready: 'false'
        cleanup: 'false'
      env:
        MOCK_AWS_VERSION: '10'

    - name: Verify outputs
      run: |
        if [[ "${{ steps.run-action.outputs.new-version }}" != "10" ]]; then
          echo "::error::Expected new-version=10, got '${{ steps.run-action.outputs.new-version }}'"
          exit 1
        fi

  test-validation:
    name: Input validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install mock AWS CLI
      run: |
        chmod +x test/mock-aws.sh
        mkdir -p "${{ runner.temp }}/mock-bin"
        ln -s "${{ github.workspace }}/test/mock-aws.sh" "${{ runner.temp }}/mock-bin/aws"
        echo "${{ runner.temp }}/mock-bin" >> "$GITHUB_PATH"

    - name: Should fail on invalid concurrency
      id: bad-concurrency
      continue-on-error: true
      uses: ./
      with:
        function-name: 'test-lambda-function'
        provisioned-concurrency: '-1'

    - name: Verify failure
      run: |
        if [[ "${{ steps.bad-concurrency.outcome }}" != "failure" ]]; then
          echo "::error::Expected action to fail with invalid concurrency"
          exit 1
        fi
        echo "Correctly rejected invalid input"
